; Tessera POS in Docker. Branding uploads are up to a few MB; dompdf builds PDFs in memory.
upload_max_filesize = 8M
post_max_size = 8M
memory_limit = 256M
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
date.timezone = Africa/Nairobi
expose_php = Off
