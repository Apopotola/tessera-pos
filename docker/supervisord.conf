[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=node server.js
directory=/var/www/tessera/frontend
environment=NODE_ENV="production",NEXT_TELEMETRY_DISABLED="1",HOSTNAME="127.0.0.1",PORT="3000",NODE_OPTIONS="--max-old-space-size=160"
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -c /etc/nginx/tessera.conf -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Laravel scheduler: etims:process and notifications:run every minute, the nightly low-stock digest,
; customers:anonymise-inactive and inventory:check-ledger (23:30).
[program:scheduler]
command=php artisan schedule:work
directory=/var/www/tessera/backend
user=www-data
; supervisord passes on HOME=/root; libpq looks there for SSL files and fails on Neon (sslmode=require).
environment=HOME="/var/www"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Queue worker for SubmitEtimsDocument (database queue, no Redis).
[program:queue]
command=php artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --memory=96
directory=/var/www/tessera/backend
user=www-data
environment=HOME="/var/www"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
