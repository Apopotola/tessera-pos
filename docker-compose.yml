# Tessera POS in Docker: PostgreSQL + the app (API, web app, Nginx, scheduler and queue in one container).
#
#   docker compose up -d --build          -> http://localhost:8080  (owner@tessera.test / password)
#   docker compose --profile share up -d  -> also a free public HTTPS link (README "Docker")
#
# Demo settings: APP_ENV=local seeds the demo shop, M-PESA is simulated (fake) and eTIMS is off.
# A real shop runs APP_ENV=production with its own owner account, MPESA_DRIVER=daraja and eTIMS.
# compose.dev.yaml (database only, for `php artisan serve` + `pnpm dev`) is separate.
name: tessera-docker

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tessera_pos
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tessera-local-only}
      TZ: Africa/Nairobi
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessera -d tessera_pos"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: tessera-pos:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_NAME: "Tessera POS"
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_TIMEZONE: Africa/Nairobi
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: tessera_pos
      DB_USERNAME: tessera
      DB_PASSWORD: ${DB_PASSWORD:-tessera-local-only}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      # Browser, web app and API share one origin behind Nginx: trust whatever host the request came in on.
      SANCTUM_STATEFUL_DOMAINS: __SANCTUM_CURRENT_REQUEST_HOST__
      TESSERA_DEMO: ${TESSERA_DEMO:-true}
      TESSERA_OWNER_EMAIL: ${TESSERA_OWNER_EMAIL:-}
      TESSERA_OWNER_PASSWORD: ${TESSERA_OWNER_PASSWORD:-}
      MPESA_DRIVER: ${MPESA_DRIVER:-fake}
      MPESA_CALLBACK_TOKEN: ${MPESA_CALLBACK_TOKEN:-local-docker-only}
      ETIMS_DRIVER: ${ETIMS_DRIVER:-disabled}
    volumes:
      - app-storage:/var/www/tessera/backend/storage/app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/ping | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # Free public HTTPS link (Cloudflare quick tunnel, no account). Only with --profile share.
  # The link is printed in: docker compose logs tunnel   (look for https://....trycloudflare.com)
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["share"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:8080
    depends_on:
      app:
        condition: service_healthy

volumes:
  db-data:
  app-storage:
